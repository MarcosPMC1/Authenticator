services:
  auth-api:
    container_name: "auth-api"
    environment:
      - NODE_ENV=${NODE_ENV}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    env_file:
      - .env
    build:
      context: .
      target: "${NODE_ENV}"
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - ./key:/usr/keys/key
      - ./key.pub:/usr/keys/key.pub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network

  postgres: 
    container_name: "auth-postgres"
    image: postgres:latest
    ports:
      - 5432:5432
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: "${POSTGRES_DATABASE}"
    volumes:
      - auth-postgres-data:/var/lib/postgresql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    container_name: "otel-collector"
    image: otel/opentelemetry-collector-contrib:0.95.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "1888:1888" # pprof extension
      - "8888:8888" # Prometheus metrics exposed by the collector
      - "8889:8889" # Prometheus metrics exporter (scraped by prometheus)
      - "13133:13133" # health_check extension
    depends_on:
      - tempo
    networks:
      - auth-network
    restart: unless-stopped

  prometheus:
    container_name: "prometheus"
    image: prom/prometheus:latest
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - auth-network
    restart: unless-stopped

  loki:
    container_name: "loki"
    image: grafana/loki:3.0.0
    volumes:
      - ./telemetry/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - auth-network
    restart: unless-stopped

  tempo:
    container_name: "tempo"
    image: grafana/tempo:latest
    volumes:
      - ./telemetry/tempo.yaml:/etc/tempo.yaml
    command: -config.file=/etc/tempo.yaml
    ports:
      - "3200:3200"
    networks:
      - auth-network
    restart: unless-stopped

  grafana:
    container_name: "grafana"
    image: grafana/grafana:latest
    volumes:
      - ./telemetry/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3001:3000"
    networks:
      - auth-network
    restart: unless-stopped
  
networks:
  auth-network:
    name: "auth-network"

volumes:
  auth-postgres-data: